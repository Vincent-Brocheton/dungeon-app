# Déclenché par un tag `vX.Y.Z` : publie l'APK sur GitHub Releases
# et, si les secrets Cloudflare existent, déploie le web sur Cloudflare Pages.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get
        working-directory: apps/character_app

      # Signature release (optionnelle). Requiert :
      #  - secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
      #  - android/app/build.gradle(.kts) configuré pour lire android/key.properties
      #    (voir docs.flutter.dev/deployment/android#signing-the-app)
      - name: Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > apps/character_app/android/upload-keystore.jks
          cat > apps/character_app/android/key.properties <<EOT
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOT

      - name: APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "character_app-${{ github.ref_name }}.apk"
        working-directory: apps/character_app

      - name: Web
        run: flutter build web --release
        working-directory: apps/character_app

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/character_app/character_app-${{ github.ref_name }}.apk
          generate_release_notes: true

      # Requiert secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID et la variable CF_PAGES_PROJECT.
      - name: Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/character_app/build/web --project-name=${{ vars.CF_PAGES_PROJECT }}
